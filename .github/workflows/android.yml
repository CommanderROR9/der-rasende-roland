name: Android-APK

# Baut die installierbare WebView-Huelle des Spiels und haengt die APK an das
# Test-Release android-v1.0.1. Laeuft auf Knopfdruck und bei jedem Push auf den
# Android-Branch.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-apk
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Release-APK bauen
    runs-on: ubuntu-latest
    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK
        uses: android-actions/setup-android@v3
        with:
          # Das Action-Default `tools` ist aus dem SDK-Repository entfernt.
          packages: platform-tools

      - name: SDK-Pakete installieren
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Kein Secret noetig: der Schluessel wird fuer diesen Lauf erzeugt und mit
      # dem Runner verworfen. Damit ist die APK sideload-tauglich signiert.
      # Hinweis: Jeder Lauf erzeugt einen neuen Schluessel - vor der Installation
      # ueber eine bestehende App muss diese zuvor deinstalliert werden.
      - name: Release-APK signiert bauen
        env:
          DRR_STORE_FILE: ${{ runner.temp }}/drr-sideload.keystore
          DRR_KEY_ALIAS: drr
        run: |
          set -euo pipefail
          export DRR_STORE_PASSWORD="$(openssl rand -hex 16)"
          export DRR_KEY_PASSWORD="$DRR_STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$DRR_STORE_FILE" \
            -storetype PKCS12 \
            -alias "$DRR_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$DRR_STORE_PASSWORD" -keypass "$DRR_KEY_PASSWORD" \
            -dname "CN=Der Rasende Roland, OU=Sideload, O=DRR, C=DE"
          gradle -p android --no-daemon assembleRelease

      - name: APK pruefen (Inhalt)
        run: |
          set -euo pipefail
          APK="$(ls android/app/build/outputs/apk/release/*.apk)"
          echo "APK: $APK"
          unzip -l "$APK" | grep -E 'classes\.dex|assets/www/(index\.html|src/main\.js)' || {
            echo "::error::Spieldateien fehlen in der APK"; exit 1; }
          unzip -l "$APK" | grep -c 'assets/www/src/' | xargs echo "Moduldateien in assets/www/src/:"
          cp "$APK" "$RUNNER_TEMP/der-rasende-roland-v1.0.1.apk"
          ls -l "$RUNNER_TEMP/der-rasende-roland-v1.0.1.apk"

      - name: APK als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: der-rasende-roland-v1.0.1-apk
          path: ${{ runner.temp }}/der-rasende-roland-v1.0.1.apk
          if-no-files-found: error

      - name: APK ans Test-Release haengen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ runner.temp }}/der-rasende-roland-v1.0.1.apk
        run: |
          set -euo pipefail
          if ! gh release view android-v1.0.1 >/dev/null 2>&1; then
            gh release create android-v1.0.1 \
              --title "Der Rasende Roland - Android v1.0.1 (Test)" \
              --notes "Testfassung der Android-Huelle: Startrobustheit fuer Geraete mit WebView-Startproblem, plus Fehlerbericht statt wortlosem Schliessen. Bitte vor der Installation die alte App deinstallieren." \
              --prerelease
          fi
          gh release upload android-v1.0.1 "$APK" --clobber
          gh release view android-v1.0.1 --json assets --jq '.assets[].name'
